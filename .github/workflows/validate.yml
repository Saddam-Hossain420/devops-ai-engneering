# Repository validation: link check, progress consistency, script tests, lesson code tests
# Action-গুলো commit SHA দিয়ে pin করা (L03-06); SHA: git ls-remote https://github.com/actions/<name>
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Internal Markdown links
        run: python3 scripts/check_links.py

      - name: Progress consistency
        run: python3 scripts/progress.py validate

      - name: Repository script tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Lesson code tests
        # প্রতিটি lesson-এর code folder-এ test_*.py থাকলে চালায়
        run: |
          set -euo pipefail
          shopt -s nullglob
          for d in [0-9][0-9]-*/code/L*/; do
            if compgen -G "${d}test_*.py" > /dev/null; then
              echo "::group::${d}"
              python3 -m unittest discover -s "${d}" -v
              echo "::endgroup::"
            fi
          done
