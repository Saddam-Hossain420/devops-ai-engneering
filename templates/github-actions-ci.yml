# Template: Python application CI (lint → test → build image)
# ব্যবহার: .github/workflows/ci.yml হিসেবে copy করে APP_DIR ও IMAGE_NAME বদলান।
name: ci

on:
  pull_request:
  push:
    branches: [main]

# সর্বনিম্ন permission — দরকার হলে job-level-এ বাড়ান
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: app
  IMAGE_NAME: example-app

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r "${APP_DIR}/requirements.txt"
      - name: Test
        run: python -m pytest "${APP_DIR}" -q

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image (tag = commit SHA, immutable)
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" "${APP_DIR}"
