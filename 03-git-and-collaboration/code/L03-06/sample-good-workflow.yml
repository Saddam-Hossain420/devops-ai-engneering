# নমুনা: Python project-এর জন্য নিরাপদ CI workflow — `.github/workflows/ci.yml` হিসেবে copy করুন।
# Action-এর SHA নিজে যাচাই করে বসান:  git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2
# (নিচের SHA-গুলো এই repository-তে git ls-remote দিয়ে নেওয়া — Section 9.3; নিজে আবার মিলিয়ে নিন)
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Greet (untrusted input via env, not inline)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "PR title: $PR_TITLE"

      - name: Unit tests
        run: python -m unittest discover -s tests -v
