# /etc/ssh/sshd_config.d/10-hardening.conf  (L01-13)
# Ubuntu: sshd_config-এর শুরুতে Include থাকায় এই file আগে পড়া হয় এবং first-value-wins নিয়মে জেতে
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3
X11Forwarding no
AllowAgentForwarding no
AllowGroups ssh-users
