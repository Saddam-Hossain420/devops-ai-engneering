# /etc/logrotate.d/taskflow   (L01-14)
# এমন application-এর জন্য যা নিজে /var/log/taskflow/*.log file-এ লেখে।
# (systemd service stdout-এ log করলে journald নিজেই rotate করে — এই file লাগে না।)
/var/log/taskflow/*.log {
    daily
    rotate 14
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    create 0640 taskflow adm
    sharedscripts
    postrotate
        systemctl kill --signal=HUP --kill-whom=main taskflow.service >/dev/null 2>&1 || true
    endscript
}
