# TaskFlow API v0.1-এর সামনে nginx (L05-13) — Ubuntu: /etc/nginx/sites-available/taskflow.conf
# TLS L06-07-এ যোগ হবে; এখন শুধু port 80।

upstream taskflow_app {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;                         # nginx ↔ app connection reuse
}

log_format upstream_timing '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                           'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time '
                           'us=$upstream_status rid=$request_id';

server {
    listen 80;
    server_name taskflow.example.com;

    access_log /var/log/nginx/taskflow.access.log upstream_timing;
    client_max_body_size 32k;             # app-এর নিজের সীমা ১৬ KB — nginx আগেই বড় body থামায়
    client_body_timeout 10s;
    client_header_timeout 10s;

    location / {
        proxy_pass http://taskflow_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout;    # শুধু idempotent-নিরাপদ ব্যর্থতায় (non-idempotent POST nginx নিজে retry করে না)
    }

    location = /health {
        proxy_pass http://taskflow_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;                       # health probe-এ log ভরে না
    }
}
