# হাতে তৈরি নমুনা: এক machine-এ কয়েকটি site (Ubuntu-তে প্রতিটি আলাদা file sites-available/-এ থাকত)

# ১. catch-all: অজানা Host বা সরাসরি IP দিয়ে এলে — কিছু ফাঁস না করে connection বন্ধ
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ২. মূল site — static file
server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/example;
    index index.html;

    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ^~ /static/ {
        expires 7d;
    }
    location ~* \.(png|jpg|jpeg|gif|svg)$ {
        expires 30d;
    }
    location ~ /\. {
        deny all;
    }
}

# ৩. API — TaskFlow (L06-04-এ proxy বিস্তারিত)
server {
    listen 80;
    server_name taskflow.example.com;
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

# ৪. সব customer subdomain
server {
    listen 80;
    server_name *.example.com;
    return 302 https://example.com/;
}

# ৫. regex দিয়ে environment-ভিত্তিক নাম
server {
    listen 80;
    server_name ~^(?<env>dev|staging)\.example\.net$;
    root /var/www/preview;
}
