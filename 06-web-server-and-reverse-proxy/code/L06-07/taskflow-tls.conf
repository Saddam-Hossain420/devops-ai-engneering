# TaskFlow — HTTPS (L06-07)। certbot (Let's Encrypt) বা lab PKI-র file।
# http → https redirect; TLS 1.2/1.3; fullchain; HSTS (always)। upstream L06-05-এর unix socket।

upstream taskflow_app {
    server unix:/run/taskflow/taskflow.sock;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name taskflow.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }   # HTTP-01 challenge
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taskflow.example.com;

    ssl_certificate     /etc/letsencrypt/live/taskflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskflow.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;   # প্রথমে ছোট max-age দিয়ে শুরু করুন
    client_max_body_size 32k;

    location / {
        proxy_pass http://taskflow_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
