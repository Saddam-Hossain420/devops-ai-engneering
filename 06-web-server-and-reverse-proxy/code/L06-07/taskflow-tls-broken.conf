# হাতে তৈরি নমুনা — পুরোনো blog post থেকে copy করা TLS config (ইচ্ছাকৃত ভুলসহ)
server {
    listen 80;
    server_name taskflow.example.com;
    location / { proxy_pass http://127.0.0.1:8000; }
}

server {
    listen 443 ssl;
    server_name taskflow.example.com;
    ssl_certificate     /etc/ssl/taskflow/cert.pem;
    ssl_certificate_key /tmp/taskflow.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers "HIGH:RC4:3DES";
    server_tokens on;
    add_header Strict-Transport-Security "max-age=31536000";
    location / { proxy_pass http://127.0.0.1:8000; }
}
