# WordPress + PHP-FPM (Ubuntu 24.04: php8.3-fpm) — /etc/nginx/sites-available/blog.conf
# TLS L06-07-এর মতো যোগ করুন; এখানে শুধু PHP-এর অংশে মনোযোগ।
server {
    listen 80;
    server_name blog.example.com;
    root /var/www/wordpress;
    index index.php;
    client_max_body_size 32m;                       # media upload; php.ini-এর upload_max_filesize-এর সাথে মেলান

    location / {
        try_files $uri $uri/ /index.php?$args;      # pretty permalinks → front controller
    }

    location ~ \.php$ {
        try_files $uri =404;                        # file সত্যিই আছে কিনা — path-info কৌশল ঠেকায়
        include fastcgi.conf;                       # SCRIPT_FILENAME সহ (fastcgi_params-এ নেই)
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~* /wp-content/uploads/.*\.php$ { deny all; }     # upload-এ কখনো PHP নয়
    location ~ /\.(?!well-known) { deny all; }                  # .git, .env, .htaccess
    location = /wp-config.php { deny all; }
    location = /xmlrpc.php { deny all; }                        # দরকার না হলে (Jetpack ইত্যাদি লাগে)
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|woff2?)$ { expires 30d; access_log off; }
}
