# হাতে তৈরি নমুনা — পুরোনো tutorial থেকে copy করা WordPress config (ইচ্ছাকৃত ভুলসহ)
server {
    listen 80;
    server_name blog.example.com;
    root /var/www/wordpress;
    index index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
    }
}
